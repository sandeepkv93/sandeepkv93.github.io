name: Refresh Portfolio Telemetry Data
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "index.html"
      - "data/linkedin-profile.json"
      - "scripts/update_site_data.py"
      - ".github/workflows/update-site-data.yml"
permissions:
  contents: write
concurrency:
  group: update-site-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch live GitHub telemetry and rebuild knowledge index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python3 scripts/update_site_data.py
      - name: Commit updated site data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-stats.json data/knowledge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live portfolio telemetry and knowledge index"
            git push
          fi
